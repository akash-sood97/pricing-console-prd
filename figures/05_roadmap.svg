<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="a" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#a7a6a0"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/><text x="30" y="44" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start">Roadmap</text><text x="30" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Now, Next, Later: each release has an exit gate that must be met before the next one starts.</text><rect x="30" y="100" width="370" height="560" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><rect x="30" y="100" width="370" height="64" rx="10" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="50" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">NOW · v1</text><text x="50" y="152" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="start">Read-only recommendation</text><circle cx="56" cy="191" r="5" fill="#2a78d6"/><text x="72" y="196" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Recommendation view with both-sided</text><text x="72" y="216" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">consequence tiles</text><circle cx="56" cy="257" r="5" fill="#2a78d6"/><text x="72" y="262" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Guardrail states and price-range flags</text><circle cx="56" cy="323" r="5" fill="#2a78d6"/><text x="72" y="328" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Segment list with test-first badges</text><circle cx="56" cy="389" r="5" fill="#2a78d6"/><text x="72" y="394" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Instrumentation live from day one</text><rect x="46" y="470" width="338" height="170" rx="8" fill="#f4f8ff" stroke="none" stroke-width="1.5"/><text x="60" y="496" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#52514e" text-anchor="start">Exit gate</text><text x="60" y="522" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">8 of 10 pilot managers use it weekly for 4</text><text x="60" y="544" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">weeks; 0 guardrail breaches shipped from a</text><text x="60" y="566" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">console recommendation</text><rect x="420" y="100" width="370" height="560" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><rect x="420" y="100" width="370" height="64" rx="10" fill="#1baf7a" stroke="none" stroke-width="1.5"/><text x="440" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">NEXT · v2</text><text x="440" y="152" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#fff" text-anchor="start">Simulate, approve, ship</text><circle cx="446" cy="191" r="5" fill="#1baf7a"/><text x="462" y="196" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Editable assumptions, versioned</text><text x="462" y="216" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">scenarios</text><circle cx="446" cy="257" r="5" fill="#1baf7a"/><text x="462" y="262" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Approval workflow with audit trail</text><circle cx="446" cy="323" r="5" fill="#1baf7a"/><text x="462" y="328" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Guarded rollouts with auto-revert</text><circle cx="446" cy="389" r="5" fill="#1baf7a"/><text x="462" y="394" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Pooled price tests with experiment</text><text x="462" y="414" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">hooks</text><rect x="436" y="470" width="338" height="170" rx="8" fill="#e8f6f0" stroke="none" stroke-width="1.5"/><text x="450" y="496" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#52514e" text-anchor="start">Exit gate</text><text x="450" y="522" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Time-to-price-change down 50% vs</text><text x="450" y="544" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">spreadsheet baseline; rollbacks under 5%</text><text x="450" y="566" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">of changes</text><rect x="810" y="100" width="370" height="560" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><rect x="810" y="100" width="370" height="64" rx="10" fill="#eb6834" stroke="none" stroke-width="1.5"/><text x="830" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">LATER · v3</text><text x="830" y="1