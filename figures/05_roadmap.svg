</text><text x="30" y="690" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Gate thresholds are proposals to agree with the sponsor; none is measured.</text></svg>