<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="a" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#a7a6a0"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/><text x="30" y="44" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start">Assistant architecture</text><text x="30" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">A language model explains; the pricing engine computes; checks decide whether the answer is shown.</text><rect x="30" y="120" width="190" height="140" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="2"/><text x="125.0" y="156" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">1  Question</text><text x="125.0" y="186" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">typed in the console</text><line x1="224" y1="190" x2="263" y2="190" stroke="#52514e" stroke-width="2.2" marker-end="url(#a)"/><rect x="267" y="120" width="190" height="140" rx="10" fill="#fdeee6" stroke="#eb6834" stroke-width="2"/><text x="362.0" y="156" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">2  Pre-check</text><text x="362.0" y="186" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">intent and guardrail</text><text x="362.0" y="206" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">screen</text><line x1="461" y1="190" x2="500" y2="190" stroke="#52514e" stroke-width="2.2" marker-end="url(#a)"/><rect x="504" y="120" width="190" height="140" rx="10" fill="#f4f8ff" stroke="#2a78d6" stroke-width="2"/><text x="599.0" y="156" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">3  Tools</text><text x="599.0" y="186" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">pricing engine API:</text><text x="599.0" y="206" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">recommendation and</text><text x="599.0" y="226" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">scenario</text><line x1="698" y1="190" x2="737" y2="190" stroke="#52514e" stroke-width="2.2" marker-end="url(#a)"/><rect x="741" y="120" width="190" height="140" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="2"/><text x="836.0" y="156" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">4  Language model</text><text x="836.0" y="186" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">explains tool results</text><text x="836.0" y="206" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">only</text><line x1="935" y1="190" x2="974" y2="190" stroke="#52514e" stroke-width="2.2" marker-end="url(#a)"/><rect x="978" y="120" width="190" height="140" rx="10" fill="#fdeee6" stroke="#eb6834" stroke-width="2"/><text x="1073.0" y="156" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">5  Post-checks</text><text x="1073.0" y="186" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">grounding, causal</text><text x="1073.0" y="206" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">language, refusal,</text><text x="1073.0" y="226" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">caveats</text><rect x="978" y="310" width="190" height="74" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/><text x="1073.0" y="340" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="middle">Answer shown</text><text x="1073.0" y="362" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">with its sources</text><line x1="1073" y1="260" x2="1073" y2="310" stroke="#1baf7a" stroke-width="2.2" marker-end="url(#a)"/><rect x="741" y="310" width="200" height="74" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="841.0" y="340" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#eb6834" text-anchor="middle">Answer withheld</text><text x="841.0" y="362" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">card and sources shown</text><line x1="1018" y1="260" x2="881" y2="310" stroke="#eb6834" stroke-width="2.2" marker-end="url(#a)"/><text x="30" y="340" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Fixed settings</text><text x="30" y="362" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">specified, not left as defaults</text><circle cx="40" cy="424" r="4" fill="#2a78d6"/><text x="54" y="429" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Temperature 0: a sampler is not a calculator, and pricing explanations cannot vary run to run</text><circle cx="40" cy="458" r="4" fill="#2a78d6"/><text x="54" y="463" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Context budget: one segment card plus at most 4 scenario rows; drop assumption text last, never the numbers</text><circle cx="40" cy="492" r="4" fill="#2a78d6"/><text x="54" y="497" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Retrieval unit: one segment per chunk, so a number is never grounded in the wrong segment</text><circle cx="40" cy="526" r="4" fill="#2a78d6"/><text x="54" y="531" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Numbers come from tools only: the model may quote them, never compute them</text><rect x="30" y="600" width="1140" height="70" rx="10" fill="#f4f8ff" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4"/><text x="50" y="628" font-family="Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Evaluation harness (this repo): 24 labelled cases, deterministic checks, run on every prompt or model change</text><text x="50" y="652" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Release rule: 100% on faithfulness and refusal cases, or the assistant does not ship. No language model was called to build this repo.</text></svg>