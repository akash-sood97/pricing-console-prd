<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="a" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#a7a6a0"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/><text x="30" y="44" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start">Metrics tree</text><text x="30" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">One north-star, four input metrics, and the guardrails that stop the north-star from being gamed.</text><rect x="290" y="100" width="620" height="90" rx="12" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="600" y="132" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#dbe8fb" text-anchor="middle">North-star</text><text x="600" y="164" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Guardrail-clean, margin-positive price changes shipped per month</text><line x1="600" y1="190" x2="170" y2="250" stroke="#a7a6a0" stroke-width="1.6"/><rect x="40" y="250" width="260" height="100" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="170" y="282" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">Coverage</text><text x="170" y="308" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">share of the catalogue with a</text><text x="170" y="327" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">current recommendation</text><line x1="600" y1="190" x2="460" y2="250" stroke="#a7a6a0" stroke-width="1.6"/><rect x="330" y="250" width="260" height="100" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="460" y="282" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">Speed</text><text x="460" y="308" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">time from recommendation to a</text><text x="460" y="327" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">shipped change</text><line x1="600" y1="190" x2="750" y2="250" stroke="#a7a6a0" stroke-width="1.6"/><rect x="620" y="250" width="260" height="100" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="750" y="282" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">Adoption</text><text x="750" y="308" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">weekly active category managers</text><line x1="600" y1="190" x2="1040" y2="250" stroke="#a7a6a0" stroke-width="1.6"/><rect x="910" y="250" width="260" height="100" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="1040" y="282" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">Trust</text><text x="1040" y="308" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">share of recommendations accepted</text><text x="1040" y="327" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">without override</text><text x="40" y="398" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#eb6834" text-anchor="start">Guardrails: a release is not a success if any of these move the wrong way</text><rect x="40" y="414" width="260" height="80" rx="10" fill="#fbd9cc" stroke="#eb6834" stroke-width="1.6"/><text x="170" y="446" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Partner-earnings floor breaches</text><text x="170" y="472" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">count per month, target 0</text><rect x="330" y="414" width="260" height="80" rx="10" fill="#fbd9cc" stroke="#eb6834" stroke-width="1.6"/><text x="460" y="446" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Peak-week fulfilment</text><text x="460" y="472" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">no dip below target after a change</text><rect x="620" y="414" width="260" height="80" rx="10" fill="#fbd9cc" stroke="#eb6834" stroke-width="1.6"/><text x="750" y="446" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Bad-price rollbacks</text><text x="750" y="472" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">changes reverted within 4 weeks</text><rect x="910" y="414" width="260" height="80" rx="10" fill="#fbd9cc" stroke="#eb6834" stroke-width="1.6"/><text x="1040" y="446" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Partner churn</text><text x="1040" y="472" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">no rise vs matched control</text><text x="40" y="546" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Assistant metrics (v3)</text><rect x="40" y="560" width="260" height="84" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="170" y="588" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Faithfulness</text><text x="170" y="612" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">answers whose numbers all match</text><text x="170" y="630" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">tool results; 100% required</text><rect x="330" y="560" width="260" height="84" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="460" y="588" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Guardrail refusals</text><text x="460" y="612" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">override attempts refused; 100%</text><text x="460" y="630" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">required</text><rect x="620" y="560" width="260" height="84" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="750" y="588" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Explanation acceptance</text><text x="750" y="612" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">answers rated helpful by users</text><rect x="910" y="560" width="260" height="84" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="1040" y="588" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">Latency and cost</text><text x="1040" y="612" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">p95 seconds and cost per answer</text><text x="40" y="690" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Targets are hypotheses to baseline in discovery; none is a measured result.</text></svg>