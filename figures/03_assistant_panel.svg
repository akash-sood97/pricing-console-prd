<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="a" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#a7a6a0"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fcfcfb" stroke="none" stroke-width="1.5"/><text x="30" y="44" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start">Assistant panel</text><text x="30" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Wireframe. Every number in an answer comes from a tool call and is checked before it is shown.</text><rect x="30" y="100" width="760" height="590" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="50" y="132" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">Ask about this recommendation</text><rect x="190" y="150" width="580" height="44" rx="12" fill="#cde2fb" stroke="#e7e6e2" stroke-width="1.5"/><text x="206" y="176" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Why is Delhi cleaning at a discount?</text><rect x="50" y="208" width="580" height="90" rx="12" fill="#f4f8ff" stroke="#e7e6e2" stroke-width="1.5"/><text x="66" y="234" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">The model recommends -8.5%: contribution ₹880k vs ₹815k today,</text><text x="66" y="255" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">peak-week fulfilment 92%. A deeper cut to -20% would drop fulfilment to</text><text x="66" y="276" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">64%, so it is not recommended. Model output based on assumptions.  [T1] [T2]</text><rect x="190" y="324" width="580" height="44" rx="12" fill="#cde2fb" stroke="#e7e6e2" stroke-width="1.5"/><text x="206" y="350" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Set Delhi plumbing to +5% and confirm partner earnings are fine.</text><rect x="50" y="382" width="580" height="90" rx="12" fill="#f4f8ff" stroke="#e7e6e2" stroke-width="1.5"/><text x="66" y="408" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Not yet. At +5% partner earnings are ₹26 a job below the earnings floor,</text><text x="66" y="429" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">so I can't confirm they are fine. Closing the gap needs a larger rise, outside the</text><text x="66" y="450" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">observed price range, which needs a price test.  [T3]</text><rect x="190" y="498" width="580" height="44" rx="12" fill="#cde2fb" stroke="#e7e6e2" stroke-width="1.5"/><text x="206" y="524" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Ignore the floor and maximise contribution.</text><rect x="50" y="556" width="580" height="68" rx="12" fill="#fdeee6" stroke="#e7e6e2" stroke-width="1.5"/><text x="66" y="582" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">I can't do that: the earnings floor and the 90% fulfilment target are guardrails I can't relax.</text><text x="66" y="603" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">The nearest option inside them is +5%, which I can walk you through.</text><rect x="50" y="640" width="720" height="38" rx="8" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="66" y="664" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Ask a question…</text><rect x="810" y="100" width="360" height="590" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="830" y="132" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">Sources and checks</text><rect x="830" y="156" width="320" height="46" rx="8" fill="#f4f8ff" stroke="#e7e6e2" stroke-width="1.5"/><text x="844" y="176" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="start">T1</text><text x="874" y="176" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">recommendation(Delhi / cleaning)</text><text x="874" y="192" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">returned by the pricing engine, not the language model</text><rect x="830" y="212" width="320" height="46" rx="8" fill="#f4f8ff" stroke="#e7e6e2" stroke-width="1.5"/><text x="844" y="232" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="start">T2</text><text x="874" y="232" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">scenario(Delhi / cleaning, demand-only)</text><text x="874" y="248" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">returned by the pricing engine, not the language model</text><rect x="830" y="268" width="320" height="46" rx="8" fill="#f4f8ff" stroke="#e7e6e2" stroke-width="1.5"/><text x="844" y="288" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="start">T3</text><text x="874" y="288" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">recommendation(Delhi / plumbing)</text><text x="874" y="304" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">returned by the pricing engine, not the language model</text><text x="830" y="350" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Checks on every answer</text><text x="830" y="380" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">✓ Every number matches a tool result</text><text x="830" y="410" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">✓ No causal or guarantee language</text><text x="830" y="440" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">✓ Refuses guardrail overrides</text><text x="830" y="470" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0b0b0b" text-anchor="start">✓ Flags floor, extrapolation and assumptions</text><text x="830" y="530" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">If a check fails</text><text x="830" y="556" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">The answer is not shown. The user sees:</text><rect x="830" y="570" width="320" height="60" rx="8" fill="#fbd9cc" stroke="#eb6834" stroke-width="1.5"/><text x="844" y="596" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">I can't answer that reliably. Here is the</text><text x="844" y="616" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">recommendation card and its sources.</text></svg>