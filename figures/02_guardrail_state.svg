/text><rect x="38" y="422" width="344" height="42" rx="8" fill="#ffffff" stroke="#e7e6e2" stroke-width="1"/><text x="50" y="448" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Hyderabad · appliance repair</text><text x="288" y="448" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">+5.0%</text><rect x="296" y="431" width="76" height="24" rx="12" fill="#cde2fb" stroke="none" stroke-width="1.5"/><text x="334.0" y="448" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#0b0b0b" text-anchor="middle">test more</text><rect x="38" y="472" width="344" height="42" rx="8" fill="#ffffff" stroke="#e7e6e2" stroke-width="1"/><text x="50" y="498" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Hyderabad · cleaning</text><text x="288" y="498" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">+5.0%</text><rect x="296" y="481" width="76" height="24" rx="12" fill="#cde2fb" stroke="none" stroke-width="1.5"/><text x="334.0" y="498" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#0b0b0b" text-anchor="middle">test more</text><rect x="38" y="522" width="344" height="42" rx="8" fill="#ffffff" stroke="#e7e6e2" stroke-width="1"/><text x="50" y="548" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Hyderabad · pest control</text><text x="288" y="548" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">-16.0%</text><rect x="38" y="572" width="344" height="42" rx="8" fill="#ffffff" stroke="#e7e6e2" stroke-width="1"/><text x="50" y="598" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Hyderabad · plumbing</text><text x="288" y="598" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">+5.0%</text><rect x="296" y="581" width="76" height="24" rx="12" fill="#fbd9cc" stroke="none" stroke-width="1.5"/><text x="334.0" y="598" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#0b0b0b" text-anchor="middle">floor gap</text><rect x="38" y="622" width="344" height="42" rx="8" fill="#ffffff" stroke="#e7e6e2" stroke-width="1"/><text x="50" y="648" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start">Hyderabad · salon at home</text><text x="288" y="648" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">-20.0%</text><rect x="410" y="100" width="760" height="590" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="430" y="134" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">Delhi · plumbing</text><rect x="430" y="152" width="720" height="92" rx="10" fill="#fbd9cc" stroke="#eb6834" stroke-width="2"/><text x="452" y="184" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">Earnings floor not reachable inside the observed price range</text><text x="452" y="208" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">At +5% partner earnings are ₹26 a job below the ₹220 floor. Annual churn stays high (36%).</text><text x="452" y="230" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">The model suggests +25%, which sits outside the data and needs a price test first.</text><text x="430" y="278" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">What you can do from here</text><rect x="430" y="292" width="350" height="150" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="448" y="320" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Guarded rollout</text><text x="448" y="344" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">Ship +5% with a stop-loss:</text><text x="448" y="364" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">partner churn, fulfilment, conversion</text><text x="448" y="384" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">reviewed weekly; auto-revert on breach.</text><rect x="448" y="396" width="200" height="38" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="548.0" y="421" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Start guarded rollout</text><rect x="800" y="292" width="350" height="150" rx="10" fill="#ffffff" stroke="#e7e6e2" stroke-width="1.5"/><text x="818" y="320" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Price test</text><text x="818" y="344" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">Pooled +20% step across the six</text><text x="818" y="364" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">'raise' segments: about 5 weeks</text><text x="818" y="384" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">to detect the conversion change.</text><rect x="818" y="396" width="200" height="38" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="918.0" y="421" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Design the test</text><text x="430" y="490" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Blocked until the floor is met or a test approves it</text><rect x="430" y="506" width="260" height="38" rx="8" fill="#eceae6" stroke="#e7e6e2" stroke-width="1.5"/><text x="560.0" y="531" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#9a9993" text-anchor="middle">Ship at recommended price</text><text x="710" y="530" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" font-style="italic">Disabled: partner-earnings floor breached.</text><text x="430" y="590" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">Why the product does this</text><text x="430" y="614" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">A price that looks best on conversion can push partner earnings under the point where they leave.</text><text x="430" y="634" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">The console makes the breach visible and offers the two safe next steps, instead of letting a bad price ship.</text></svg>